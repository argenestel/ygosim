name: Release checks
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/fetch-data.sh
      - run: pnpm exec playwright install --with-deps chromium
      - run: bash scripts/test-provenance.sh artifacts/provenance.json
      - run: pnpm test:release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: |
            test-results/
            playwright-report/
            artifacts/
          retention-days: 14
  reference:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ninja-build g++ python3
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/fetch-data.sh
      - run: bash scripts/test-provenance.sh artifacts/provenance.json
      - run: pnpm test:extended
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-audit-fuzz-evidence
          path: |
            test-results/native-reference/differential-report.json
            packages/engine/data/reports/
            artifacts/
          retention-days: 30
